# Deploys the showcase (and public/r, the built registry) to GitHub Pages on every push to main.
name: Deploy showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href /shared-ui-angular/
      # Pages has no SPA fallback: serve the app for deep links like /shared-ui-angular/tree.
      - run: cp dist/browser/index.html dist/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/browser
      - id: deployment
        uses: actions/deploy-pages@v4
