# Checks the repo, then deploys the Angular showcase (and public/r, the built registry) to
# GitHub Pages on every push to main.
name: Deploy showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # public/r is committed: fail if it is stale against registry.json and src/ui.
      - run: npm run registry:build && git diff --exit-code -- public/r

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Project pages live under /<repo>/, so the base href follows the repository name.
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # Pages has no SPA fallback: serve the app for deep links like /<repo>/tree.
      - run: cp dist/browser/index.html dist/browser/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/browser
      - id: deployment
        uses: actions/deploy-pages@v5
