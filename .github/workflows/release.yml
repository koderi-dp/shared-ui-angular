# Publishes @koderi-dp/ui to npm and attaches the tarball to a GitHub release when a v* tag is
# pushed. The version comes from the tag.
#
# Publishing uses npm trusted publishing (no token). The one exception is the first release:
# trusted publishing is set up on the package's npm page, which only exists after a publish, so
# 0.1.0 goes out with a short-lived NPM_TOKEN secret. Delete the secret once the trusted
# publisher is configured; without it this workflow falls back to trusted publishing.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the tag to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag is not on main"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:lib
      - run: node scripts/set-version.mjs "$GITHUB_REF_NAME"
      - name: Detect a prerelease
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then echo "PRERELEASE=true" >> "$GITHUB_ENV"; fi
      - run: npx publint dist/ui
      # Trusted publishing needs npm >= 11.5.1, and >= 11.21 to set a dist-tag (`next`).
      - run: npm i -g npm@^11.21.0
      - name: Publish to npm
        working-directory: dist/ui
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with the NPM_TOKEN secret (first release only)."
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish --provenance --access public ${{ env.PRERELEASE == 'true' && '--tag next' || '' }}
      - run: npm pack ./dist/ui
      - run: gh release create "$GITHUB_REF_NAME" koderi-dp-ui-*.tgz --generate-notes ${{ env.PRERELEASE == 'true' && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
